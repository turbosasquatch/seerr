---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Publish immutable MDBList image

on:
  push:
    branches:
      - 'release/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate release branch
    runs-on: ubuntu-24.04
    outputs:
      image_tag: ${{ steps.release.outputs.image_tag }}
    steps:
      - name: Validate branch and derive image tag
        id: release
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" != "branch" ]]; then
            echo "Release images must be built from a branch; got: $GITHUB_REF_TYPE" >&2
            exit 1
          fi

          branch="$GITHUB_REF_NAME"
          if [[ ! "$branch" =~ ^release/v[0-9]+\.[0-9]+\.[0-9]+-score-mdb\.[1-9][0-9]*$ ]]; then
            echo "Expected branch release/vX.Y.Z-score-mdb.N with N >= 1 and no leading zero; got: $branch" >&2
            exit 1
          fi
          echo "image_tag=${branch#release/}" >> "$GITHUB_OUTPUT"

  publish:
    name: Build and publish linux/amd64 image
    needs: prepare
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Commit timestamp
        id: timestamp
        shell: bash
        run: echo "timestamp=$(git log -1 --pretty=%ct)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse an existing release tag
        shell: bash
        env:
          IMAGE: ghcr.io/${{ github.repository }}:${{ needs.prepare.outputs.image_tag }}
        run: |
          set +e
          inspect_output=$(docker buildx imagetools inspect "$IMAGE" 2>&1)
          inspect_status=$?
          set -e

          if [[ $inspect_status -eq 0 ]]; then
            echo "Refusing to overwrite immutable image tag: $IMAGE" >&2
            exit 1
          fi
          if [[ ! "$inspect_output" =~ (manifest[[:space:]]unknown|not[[:space:]]found|404[[:space:]]Not[[:space:]]Found) ]]; then
            echo "Could not prove that the release tag is unused; refusing to publish." >&2
            echo "$inspect_output" >&2
            exit 1
          fi

      - name: Build and publish immutable tags
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            COMMIT_TAG=${{ github.sha }}
            BUILD_VERSION=${{ needs.prepare.outputs.image_tag }}
            SOURCE_DATE_EPOCH=${{ steps.timestamp.outputs.timestamp }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ needs.prepare.outputs.image_tag }}
            ghcr.io/${{ github.repository }}:${{ needs.prepare.outputs.image_tag }}-${{ github.sha }}
          provenance: false
